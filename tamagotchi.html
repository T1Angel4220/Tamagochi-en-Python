<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego - Tamagotchi RPG</title>
  <link rel="stylesheet" href="tamagotchi.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Tamagotchi RPG</h1>
    </header>

    <main>
      <section class="game-section">
        <div class="game-area" id="game-area">
          <div class="top-nav">
            <a href="MenuSeleccion.html" class="nav-btn">⬅ Volver al Menú</a>
          </div>

          <img src="fondo.jpg" alt="Fondo del juego" class="background-img">
          <img src="papa.png" alt="Personaje" class="character" id="pet">

          <div class="floating-msg" id="status-msg">¡Cuida bien de tu mascota!</div>

          <div class="status-bars">
            <div class="status-bar">
              <label for="hunger">Hambre:</label>
              <progress id="hunger" max="100" value="50"></progress>
            </div>
            <div class="status-bar">
              <label for="boredom">Aburrimiento:</label>
              <progress id="boredom" max="100" value="50"></progress>
            </div>
            <div class="status-bar">
              <label for="sleep">Sueño:</label>
              <progress id="sleep" max="100" value="50"></progress>
            </div>
            <div class="status-bar">
              <label for="dirt">Suciedad:</label>
              <progress id="dirt" max="100" value="50"></progress>
            </div>
          </div>

          <div class="buttons">
            <button id="eat-btn" title="Alimentar">🍔 Comer</button>
            <button id="sleep-btn" title="Hacer dormir">💤 Dormir</button>
            <button id="clean-btn" title="Bañar y limpiar">🧼 Limpiarse</button>
            <button id="play-btn" title="Jugar y divertirse">🎮 Jugar</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2024 Tamagotchi RPG</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
